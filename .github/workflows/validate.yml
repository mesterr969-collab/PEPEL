name: Validate PEPEL files

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript and JSON
        shell: bash
        run: |
          if [ -f src/main.js ] && [ -f src/app.js ] && [ -f src/data/monuments.json ]; then
            npm run check
          else
            echo "::notice::Runtime sources are not uploaded yet. Copy src/ from the PEPEL publish kit to enable checks."
          fi
